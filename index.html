<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Escritorio retro de fines de los 90: fondo verde azulado, ventanas grises con relieve, barra de tareas abajo.
   Diseño de un solo tema a propósito (el escritorio no cambia con el modo oscuro). */
:root {
  --desk: #008080;
  --face: #c0c0c0;
  --hi: #ffffff;
  --lo: #808080;
  --dk: #0a0a0a;
  --lt: #dfdfdf;
  --ink: #000000;
  --field: #ffffff;
  --navy: #000080;
  --title2: #1084d0;
  --sel: #000080;
  --sel-ink: #ffffff;
  --muted: #404040;
  --bad: #c00000; --bad-bg: #ffe0e0;
  --warn: #6b5400; --warn-bg: #ffffc8;
  --ok: #006b00; --ok-bg: #dcf5dc;
  --prog: #000080;
  --ui: Tahoma, Verdana, "Segoe UI", Geneva, sans-serif;
  --big: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --lcd: "VT323", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: #3a7fe0 }
body { background: transparent; color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.4; min-height: 100vh }
.desk { max-width: 860px; margin: 0 auto; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(76px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 1px dotted var(--ink); outline-offset: -4px }
svg.px { image-rendering: pixelated; flex: none; display: block }

/* Relieves */
.raised { background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--lt) }
.sunken { background: var(--field); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--lt) }

/* Ventana */
.win { background: var(--face); padding: 3px; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--lt), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 3px 3px 0 rgba(0,0,0,.25) }
.title { display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 5px; background: linear-gradient(90deg, var(--navy), var(--title2)); color: #fff; font-weight: 700; font-size: 14px; min-height: 26px }
.title .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tbtns { display: flex; gap: 2px }
.tb { width: 22px; height: 20px; display: grid; place-items: center; font: 700 13px/1 var(--ui); color: var(--ink); border: 0; padding: 0; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--lt) }
button.tb { cursor: pointer }
button.tb:active { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo) }
.tb.off { color: var(--lo) }
.wbody { padding: 12px 10px 10px; display: flex; flex-direction: column; gap: 12px }
.menubar { display: flex; gap: 14px; padding: 3px 8px; font-size: 14px }
.menubar span:first-letter { text-decoration: underline }

/* Barra de herramientas y dirección */
.toolbar { display: flex; gap: 8px; align-items: center; padding: 6px 6px 4px; border-bottom: 1px solid var(--lo); box-shadow: 0 1px 0 var(--hi); flex-wrap: wrap }
.addr { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 200px }
.addr .lbl { font-size: 13px; color: var(--muted) }
.addr-f { flex: 1; min-width: 0; padding: 5px 8px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 0; align-items: center }
.addr-f button { all: unset; cursor: pointer; color: var(--navy); text-decoration: underline }
.addr-f button:focus-visible { outline: 1px dotted var(--ink) }
.addr-f .sep { color: var(--muted); padding: 0 2px }

/* Botones */
.b98 { border: 0; background: var(--face); padding: 6px 14px; min-height: 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
  box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--lt) }
.b98:active, .b98[aria-pressed="true"] { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo), inset -2px -2px var(--lt); padding: 7px 13px 5px 15px }
.b98:disabled { color: var(--lo); text-shadow: 1px 1px var(--hi); cursor: default }
.b98.default { outline: 1px solid var(--ink); outline-offset: -1px }
.b98.back { font-weight: 700 }

/* Textos grandes */
.big { font-family: var(--big); font-weight: 900; font-size: clamp(28px, 8vw, 46px); line-height: 1.02; letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere }
.h2 { font-family: var(--big); font-weight: 900; font-size: 22px; margin: 0 }
.sub { color: var(--muted); font-size: 14px }
.hint { color: var(--muted); font-size: 13px }
.head { display: flex; gap: 14px; align-items: center }
.head > div { min-width: 0 }

/* Barra de progreso por bloques */
.pbar { height: 22px; padding: 3px; display: flex }
.pbar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--prog) 0 9px, transparent 9px 11px) }
.pline { display: flex; gap: 10px; align-items: center }
.pline .pbar { flex: 1 }
.pline b { font-family: var(--lcd); font-size: 22px; font-weight: 400; min-width: 52px; text-align: right }

/* Próximo lanzamiento */
.count { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end }
.lcd { background: #0b2b0b; color: #7dff7d; font-family: var(--lcd); font-size: 64px; line-height: .9; padding: 8px 14px 4px; text-align: right; min-width: 120px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk) }
.lcd small { display: block; font-size: 20px; color: #4fbf4f }

/* Listas */
.list { padding: 2px }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 10px; border-bottom: 1px dotted var(--lo) }
.task:last-child .row, .task:last-child { border-bottom: 0 }
.row .main { min-width: 0; cursor: pointer }
.row .t { font-weight: 700; font-size: 15px; overflow-wrap: anywhere }
.row .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere }
.tag { font-size: 12px; color: var(--navy); font-weight: 700 }
.task.done .t { text-decoration: line-through; color: var(--lo) }
.due { color: var(--ink); font-size: 12px; font-weight: 700; padding: 3px 7px; white-space: nowrap; border: 1px solid var(--lo); background: var(--field) }
.due.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad) }
.due.warn { color: var(--warn); background: var(--warn-bg); border-color: #a08a30 }
.due.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok) }
.st { min-width: 96px; justify-content: center; font-size: 13px; font-weight: 700; padding: 5px 8px }
.st[data-e="En proceso"] { color: var(--navy) }
.st[data-e="Listo"] { color: var(--ok) }
.st[data-e="Bloqueado"] { color: var(--bad) }
.empty { padding: 14px 10px; color: var(--muted) }

/* Íconos grandes (vista explorador) */
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; padding: 10px 6px }
.ic { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; text-align: center; min-width: 0 }
.ic .lb { font-size: 13px; line-height: 1.25; padding: 1px 3px; overflow-wrap: anywhere; max-width: 100% }
.ic:hover .lb, .ic:focus-visible .lb { background: var(--sel); color: var(--sel-ink) }
.ic:focus-visible { outline: 1px dotted var(--ink) }
.ic .pc { font-family: var(--lcd); font-size: 18px; line-height: 1 }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 5px; border: 1px solid currentColor }
.badge.Publicada { color: var(--ok); background: var(--ok-bg) }
.badge.Subida { color: var(--navy); background: #e4e8ff }

/* Filas de puntos clave (vista detalles) */
.prow { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 12px 10px; border-bottom: 1px dotted var(--lo) }
.prow:last-child { border-bottom: 0 }
.prow:hover, .prow:focus-visible { background: var(--sel); color: var(--sel-ink) }
.prow:hover .sub, .prow:focus-visible .sub { color: #dde }
.prow .nm { font-family: var(--big); font-weight: 900; font-size: 20px; line-height: 1.1 }
.prow .mini { height: 12px; padding: 2px; margin-top: 5px; max-width: 220px; display: flex }
.prow .mini i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--prog) 0 5px, transparent 5px 7px) }
.prow .go { font-weight: 700 }
.prow.full .nm::after { content: " ✓"; color: var(--ok) }
.prow:hover.full .nm::after { color: #9f9 }

/* Formularios */
fieldset { border: 0; margin: 0; padding: 14px 10px 10px; position: relative; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--hi), inset -2px -2px var(--lo); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
legend { position: absolute; top: -9px; left: 8px; background: var(--face); padding: 0 4px; font-size: 13px }
fieldset label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; min-width: 0 }
fieldset .full { grid-column: 1 / -1 }
fieldset .check { flex-direction: row; align-items: center; gap: 6px }
input, select, textarea { border: 0; padding: 6px 7px; width: 100%; min-width: 0; background: var(--field); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--lt); border-radius: 0 }
input[type="checkbox"] { width: 16px; height: 16px; padding: 0 }
textarea { min-height: 56px; resize: vertical }
.actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; align-items: center }
.edit { padding: 6px 10px 12px; background: var(--face) }
.edit fieldset { background: var(--face) }
.link { color: var(--navy); font-size: 14px }

/* Barra de tareas y menú Inicio */
.taskbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--face); box-shadow: inset 0 1px var(--lt), inset 0 2px var(--hi);
  display: flex; gap: 6px; align-items: center; padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); height: calc(42px + env(safe-area-inset-bottom, 0px)) }
.start { font-weight: 700; padding: 4px 10px 4px 6px; min-height: 32px }
.ttab { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; padding: 4px 8px; min-height: 32px; font-size: 13px; font-weight: 700;
  box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo), inset -2px -2px var(--lt); background: repeating-conic-gradient(var(--face) 0 25%, var(--hi) 0 50%) 0 0 / 2px 2px }
.ttab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tray { padding: 4px 10px; min-height: 32px; display: flex; align-items: center; font-size: 13px; white-space: nowrap; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi) }
.smenu { position: fixed; z-index: 31; left: max(6px, env(safe-area-inset-left, 0px)); bottom: calc(44px + env(safe-area-inset-bottom, 0px)); display: flex; padding: 3px; width: min(300px, calc(100vw - 12px));
  background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--lt), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 3px 3px 0 rgba(0,0,0,.3) }
.sbanner { width: 30px; background: linear-gradient(0deg, var(--navy), var(--title2)); color: #fff; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--big); font-size: 20px; padding: 10px 2px; letter-spacing: .02em }
.sbanner span { opacity: .7; font-family: var(--ui); font-weight: 400 }
.sitems { flex: 1; display: flex; flex-direction: column; min-width: 0 }
.sitem { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 15px }
.sitem:hover, .sitem:focus-visible { background: var(--sel); color: var(--sel-ink) }
.sitem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ssep { height: 2px; margin: 3px 4px; box-shadow: inset 0 1px var(--lo), inset 0 -1px var(--hi) }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(54px + env(safe-area-inset-bottom, 0px)); background: var(--warn-bg); color: var(--ink); border: 1px solid var(--ink); padding: 6px 12px; font-size: 14px }
.setup { position: fixed; inset: 0; z-index: 50; padding: 16px; overflow: auto; background: linear-gradient(180deg, #0b4fc9, #7db8f5) }
.status { color: #fff; font-size: 13px; text-shadow: 1px 1px 0 #0a3d8a }
.wall { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(180deg, #0b4fc9 0%, #2f7fe8 38%, #7db8f5 62%, #bfe0ff 72%) }
.wall svg { position: absolute; inset: 0; width: 100%; height: 100% }

@media (max-width: 560px) {
  .row { grid-template-columns: auto 1fr }
  .row .due { grid-column: 2; justify-self: start }
  .prow { grid-template-columns: auto 1fr auto }
  .prow .go { display: none }
  fieldset { grid-template-columns: 1fr }
  .lcd { font-size: 52px; min-width: 96px }
  .tray .date { display: none }
}
</style>

<div class="wall" aria-hidden="true"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice">
  <defs>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7bd23a"/><stop offset=".45" stop-color="#4fae1f"/><stop offset="1" stop-color="#2f8417"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5bbd2a"/><stop offset="1" stop-color="#2b7413"/></linearGradient>
    <radialGradient id="shine" cx=".38" cy=".55" r=".5"><stop offset="0" stop-color="#b6f05a" stop-opacity=".55"/><stop offset="1" stop-color="#b6f05a" stop-opacity="0"/></radialGradient>
  </defs>
  <g fill="#fff" filter="url(#soft)" opacity=".95">
    <ellipse cx="40" cy="30" rx="44" ry="13"/><ellipse cx="70" cy="22" rx="24" ry="10"/>
    <path d="M150 20 Q230 30 300 95 Q240 60 160 35 Z" opacity=".7"/>
    <ellipse cx="350" cy="25" rx="55" ry="16"/><ellipse cx="380" cy="45" rx="30" ry="12"/>
    <ellipse cx="80" cy="95" rx="22" ry="6"/><ellipse cx="112" cy="92" rx="16" ry="7"/>
    <ellipse cx="45" cy="135" rx="38" ry="8" opacity=".8"/>
    <ellipse cx="240" cy="145" rx="36" ry="13"/><ellipse cx="275" cy="150" rx="22" ry="10"/>
    <ellipse cx="335" cy="140" rx="42" ry="16"/><ellipse cx="380" cy="130" rx="26" ry="12"/>
    <ellipse cx="160" cy="185" rx="70" ry="5" opacity=".85"/><ellipse cx="330" cy="190" rx="80" ry="8"/>
  </g>
  <path d="M0 200 Q120 186 230 196 Q330 206 400 222 L400 300 L0 300 Z" fill="url(#hill)"/>
  <path d="M0 200 Q120 186 230 196 Q330 206 400 222 L400 300 L0 300 Z" fill="url(#shine)"/>
  <path d="M0 252 Q200 244 400 248 L400 300 L0 300 Z" fill="url(#hill2)"/>
</svg></div>
<div class="desk">
  <div class="status" id="status">Cargando tus lanzamientos…</div>
  <main id="app" style="display:flex;flex-direction:column;gap:18px"></main>
</div>
<div class="smenu" id="smenu" hidden role="menu" aria-label="Menú Inicio"></div>
<nav class="taskbar" aria-label="Barra de tareas">
  <button class="b98 start" id="startbtn" data-act="start" aria-haspopup="menu" aria-expanded="false"><span id="starticon"></span>Inicio</button>
  <div class="ttab" id="ttab"></div>
  <div class="tray" id="tray"></div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Conexión con el Google Sheet (versión independiente) ---------- */
window.NS_STANDALONE = true;
(function () {
  const LS = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
  const qs = new URLSearchParams(location.search);
  if (qs.get("api") && qs.get("k")) { LS("ns_api", qs.get("api")); LS("ns_k", qs.get("k")); }
  const COLS = ["lanzamientos", "canciones", "tareas"];
  let resolveDb; const dbReady = new Promise(r => resolveDb = r);

  function makeDb(api, key) {
    const state = {}, subs = {}; let loaded = false;
    COLS.forEach(c => { state[c] = new Map(); subs[c] = []; });
    let queue = []; try { queue = JSON.parse(LS("ns_queue") || "[]"); } catch (e) {}
    try { const cache = JSON.parse(LS("ns_cache") || "null"); if (cache) COLS.forEach(c => (cache[c] || []).forEach(d => { const { id, ...x } = d; state[c].set(id, x); })); } catch (e) {}
    const snap = (c, fromCache) => ({ docs: [...state[c].entries()].map(([id, d]) => ({ id, data: () => d })), metadata: { fromCache } });
    const emit = (c) => subs[c].forEach(f => f(snap(c, false)));
    const saveCache = () => { const o = {}; COLS.forEach(c => o[c] = [...state[c].entries()].map(([id, d]) => ({ id, ...d }))); LS("ns_cache", JSON.stringify(o)); };
    const status = (t) => { const el = document.getElementById("status"); if (el) el.textContent = t; };
    function applyLocal(o) {
      const m = state[o.col];
      if (o.op === "delete") m.delete(o.id);
      else if (o.op === "update") m.set(o.id, { ...(m.get(o.id) || {}), ...o.data });
      else m.set(o.id, { ...o.data });
    }
    let timer = null, sending = false;
    function enqueue(o) {
      applyLocal(o); queue.push(o); LS("ns_queue", JSON.stringify(queue)); saveCache(); emit(o.col);
      clearTimeout(timer); timer = setTimeout(flush, 400);
    }
    async function flush() {
      if (sending || !queue.length) return;
      sending = true; const batch = queue.slice(0, 200);
      try {
        const r = await fetch(api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ k: key, ops: batch }) });
        const j = await r.json(); if (!j.ok) throw new Error(j.error || "error");
        queue = queue.slice(batch.length); LS("ns_queue", JSON.stringify(queue)); status("");
      } catch (e) { status("Sin conexión: los cambios se guardan en cuanto vuelva internet."); setTimeout(flush, 15000); }
      finally { sending = false; if (queue.length) setTimeout(flush, 100); }
    }
    async function pull() {
      if (queue.length || sending) return;
      try {
        const r = await fetch(api + (api.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(key));
        const j = await r.json();
        if (!j.ok) { status(j.error === "clave" ? "La clave no coincide con la del script." : "No se pudieron cargar los datos."); return; }
        if (queue.length || sending) return;
        COLS.forEach(c => { state[c] = new Map((j.data[c] || []).map(d => { const { id, ...x } = d; return [id, x]; })); });
        loaded = true; saveCache(); COLS.forEach(emit);
      } catch (e) { status("Sin conexión: mostrando lo último guardado en este teléfono."); COLS.forEach(c => subs[c].forEach(f => f(snap(c, false)))); }
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { flush(); pull(); } });
    setInterval(() => { if (!document.hidden) pull(); }, 60000);
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const docRef = (path) => {
      const [col, id] = path.split("/");
      return {
        update: async (data) => enqueue({ op: "update", col, id, data }),
        set: async (data) => enqueue({ op: "set", col, id, data }),
        delete: async () => enqueue({ op: "delete", col, id }),
      };
    };
    const api_ = {
      doc: docRef,
      collection: (col) => ({
        onSnapshot(fn) { subs[col].push(fn); if (state[col].size) fn(snap(col, true)); return () => { subs[col] = subs[col].filter(f => f !== fn); }; },
        add: async (data) => { const id = newId(); enqueue({ op: "set", col, id, data }); return { id }; },
        doc: (id) => docRef(col + "/" + id),
      }),
    };
    setTimeout(() => { flush(); pull(); }, 0);
    return api_;
  }

  function setupScreen() {
    const ov = document.createElement("div");
    ov.className = "setup";
    ov.innerHTML = `<section class="win" style="max-width:520px;margin:12vh auto 0">
      <div class="title"><span class="tt">Conectar con tu Google Sheet</span></div>
      <div class="wbody"><form id="setupform"><fieldset><legend>Primera vez en este teléfono</legend>

}
function renderMenu() {
  const m = $("smenu"); m.hidden = !menuOpen; $("startbtn").setAttribute("aria-expanded", String(menuOpen)); $("startbtn").setAttribute("aria-pressed", String(menuOpen));
  if (!menuOpen) return;
  const discos = rels.filter(x => x.tipo === "disco");
  const next = rels.filter(r => daysTo(parseD(r.fecha)) >= 0).sort((a, b) => a.fecha.localeCompare(b.fecha))[0];
  const nextSong = next && next.tipo !== "disco" ? songs.find(x => x.lanzamiento === next.id) : null;
  m.innerHTML = `<div class="sbanner" aria-hidden="true">Novi<span> San</span></div><div class="sitems">
    <button class="sitem" role="menuitem" data-nav='${nav({ p: "home" })}'>${ico("folder", 24)}<span>Mi música</span></button>
    ${discos.map(d => `<button class="sitem" role="menuitem" data-nav='${nav({ p: "disco", id: d.id })}'>${ico("disc", 24)}<span>${esc(d.nombre)}</span></button>`).join("")}
    ${nextSong ? `<button class="sitem" role="menuitem" data-nav='${nav({ p: "song", id: nextSong.id })}'>${ico("cd", 24)}<span>${esc(nextSong.nombre)}</span></button>` : ""}
    <div class="ssep"></div>
    ${canWrite ? `<button class="sitem" role="menuitem" data-nav='${nav({ p: "add" })}'>${ico("plus", 24)}<span>Agregar canción o disco…</span></button>` : ""}
    <button class="sitem" role="menuitem" data-act="export">${ico("upload", 24)}<span>Exportar respaldo</span></button>
    ${window.NS_STANDALONE && canWrite ? `<button class="sitem" role="menuitem" data-act="import">${ico("folder", 24)}<span>Importar respaldo…</span></button>` : ""}
    <button class="sitem" role="menuitem" data-act="start">${ico("note", 24)}<span>Cerrar menú</span></button></div>`;
}
function tick() {
  const n = new Date();
  $("tray").innerHTML = `<span class="date">${new Intl.DateTimeFormat("es-CL", { day: "numeric", month: "short" }).format(n)}&nbsp;</span>${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}`;
}
function go(v) { view = v; openTask = null; editingRel = false; confirmDel = null; menuOpen = false; render(); window.scrollTo({ top: 0, behavior: "auto" }); }

async function save(fn, okMsg) {
  if (!db) { toast("No se puede guardar en esta vista."); return; }
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; render(); toast("No tienes permiso para editar este tablero."); }
    else toast("No se guardó. Intenta de nuevo.");
  }
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act],[data-nav]");
  if (!el) { if (menuOpen && !ev.target.closest("#smenu")) { menuOpen = false; renderMenu(); } return; }
  if (el.dataset.nav) { try { go(JSON.parse(el.dataset.nav)); } catch (e) {} return; }
  const id = el.closest(".task")?.dataset.id, act = el.dataset.act;
  if (act === "export") { menuOpen = false; renderMenu(); exportBackup(); return; }
  if (act === "import") { menuOpen = false; renderMenu(); importBackup(); return; }
  if (act === "start") { menuOpen = !menuOpen; renderMenu(); if (menuOpen) $("smenu").querySelector(".sitem")?.focus(); return; }
  if (menuOpen) { menuOpen = false; renderMenu(); }
  if (act === "toggle") { openTask = openTask === id ? null : id; confirmDel = null; render(); return; }
  if (act === "cycle") {
    const t = tasks.find(x => x.id === id); if (!t) return;
    const nx = t.estado === "Pendiente" ? "En proceso" : t.estado === "En proceso" ? "Listo" : "Pendiente";
    save(() => db.doc("tareas/" + id).update({ estado: nx })); return;
  }
  if (act === "askdel") { confirmDel = id; render(); return; }
  if (act === "nodel") { confirmDel = null; render(); return; }
  if (act === "del") { confirmDel = null; openTask = null; save(() => db.doc("tareas/" + id).delete(), "Tarea borrada"); return; }
  if (act === "pdfficha") { const r = relById(view.rel); if (r) pdfFicha(r); return; }
  if (act === "copyficha") { const r = relById(view.rel); if (r) copyFicha(r); return; }
  if (act === "fichasong") { openFichaSong = openFichaSong === el.dataset.sid ? null : el.dataset.sid; render(); return; }
  if (act === "editrel") { editingRel = !editingRel; render(); return; }
  if (act === "askdelsong") { confirmDel = "song:" + view.id; render(); return; }
  if (act === "delsong") {
    const sid = view.id; go({ p: "home" });
    save(async () => { for (const t of songTasks(sid)) await db.doc("tareas/" + t.id).delete(); await db.doc("canciones/" + sid).delete(); }, "Canción borrada");
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && menuOpen) { menuOpen = false; renderMenu(); $("startbtn").focus(); return; }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches?.('[role="button"]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("change", (ev) => {
  if (ev.target.dataset?.songf && view.p === "song") {
    const sid = view.id, v = ev.target.value;
    save(() => db.doc("canciones/" + sid).update({ estado: v }), v === "En proceso" ? "Guardado" : `Marcada como ${v.toLowerCase()}`); return;
  }
  const f = ev.target.dataset?.f; if (!f) return;
  const id = ev.target.closest(".task")?.dataset.id; if (!id) return;
  let v = ev.target.value;
  if (f === "diasAntes") v = Math.max(0, Math.min(365, parseInt(v, 10) || 0));
  if (f === "tarea" && !v.trim()) return;
  save(() => db.doc("tareas/" + id).update({ [f]: v }), "Guardado");
});

async function crearCancion(nombre, lanzamiento, { mezcla, single }) {
  let sid = slug(nombre); if (songById(sid)) sid += "-" + Date.now().toString(36).slice(-4);
  const orden = Math.max(0, ...songs.map(s => s.orden || 0)) + 1;
  await db.doc("canciones/" + sid).set({ nombre, orden, lanzamiento, estado: "En proceso", carpeta: "", notas: "" });
  for (const [area, tarea, responsable, diasAntes] of plantillaCancion({ mezcla, single }))
    await db.doc("tareas/" + sid + "--" + slug(area + "-" + tarea)).set({ lanzamiento, cancion: sid, area, tarea, responsable, estado: "Pendiente", diasAntes, notas: "" });
  return sid;
}

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.target;
  if (form.id === "newtask") {
    const tarea = $("nt-tarea").value.trim(); if (!tarea) return;
    let doc;
    if (view.p === "point") { const s = songById(view.song); doc = { lanzamiento: s.lanzamiento, cancion: s.id, area: view.area }; }
    else doc = { lanzamiento: view.rel, cancion: "", area: view.area };
    Object.assign(doc, { tarea, responsable: $("nt-resp").value.trim() || "Por definir", estado: "Pendiente", diasAntes: Math.max(0, parseInt($("nt-dias").value, 10) || 0), notas: "" });
    save(() => db.collection("tareas").add(doc), "Tarea agregada");
  }
  if (form.id === "relform") {
    const r = view.p === "disco" ? relById(view.id) : relById(songById(view.id)?.lanzamiento); if (!r) return;
    const upd = { nombre: $("rf-nombre").value.trim() || r.nombre, fecha: $("rf-fecha").value || r.fecha, confirmada: $("rf-conf").checked, notas: $("rf-notas").value };
    editingRel = false;
    save(() => db.doc("lanzamientos/" + r.id).update(upd), "Guardado");
  }
  if (form.id === "addform") {
    const nombre = $("af-nombre").value.trim(), fecha = $("af-fecha").value, tipo = $("af-tipo").value;
    if (!nombre || (tipo !== "track" && !fecha)) return;
    const mezcla = $("af-mezcla").checked, conf = $("af-conf").checked;
    if (tipo === "track") {
      const disco = rels.find(r => r.tipo === "disco");
      save(async () => { const sid = await crearCancion(nombre, disco.id, { mezcla, single: false }); go({ p: "song", id: sid }); }, `${nombre} agregada al disco`);
      return;
    }
    let rid = slug(nombre); if (relById(rid)) rid += "-" + Date.now().toString(36).slice(-4);
    save(async () => {
      await db.doc("lanzamientos/" + rid).set({ nombre, fecha, confirmada: conf, tipo: tipo === "disco" ? "disco" : "single", notas: "" });
      if (tipo === "disco") {
        for (const [area, tarea, responsable, diasAntes] of PLANTILLA_DISCO())
          await db.doc("tareas/" + rid + "--" + slug(area + "-" + tarea)).set({ lanzamiento: rid, cancion: "", area, tarea, responsable, estado: "Pendiente", diasAntes, notas: "" });
        go({ p: "disco", id: rid });
      } else { const sid = await crearCancion(nombre, rid, { mezcla, single: true }); go({ p: "song", id: sid }); }
    }, `${nombre} creado`);
  }
});

async function start() {
  $("starticon").innerHTML = ico("note", 20);
  tick(); setInterval(tick, 30000);
  render();
  db = await claude.use("db");
  if (!db) { $("status").textContent = "Abre este tablero con tu cuenta para ver y editar los lanzamientos."; return; }
  try { const user = await claude.use("user"); const w = user ? await user.can("data.write") : null; if (w === false) canWrite = false; } catch (e) {}
  const timer = setTimeout(() => { $("status").textContent = "Los datos están tardando en llegar…"; }, 10000);
  const done = () => { if (gotRels && gotTasks && gotSongs) { clearTimeout(timer); $("status").textContent = canWrite ? "" : "Solo lectura"; } };
  const fail = (what) => { $("status").textContent = `No se pudieron cargar ${what}.`; };
  db.collection("lanzamientos").onSnapshot(s => { rels = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.fecha); if (!s.metadata.fromCache) gotRels = true; done(); render(); }, () => { gotRels = true; fail("los lanzamientos"); render(); });
  db.collection("tareas").onSnapshot(s => { tasks = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) gotTasks = true; done(); render(); }, () => { gotTasks = true; fail("las tareas"); render(); });
  db.collection("canciones").onSnapshot(s => { songs = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) gotSongs = true; done(); render(); }, () => { gotSongs = true; fail("las canciones"); render(); });
}
start();
</script>
